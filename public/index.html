<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوّنلي — يومياتي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand brand-sm">
          <span class="brand-mark">✍️</span>
          <span class="brand-name">دوّنلي</span>
        </div>
        <button id="logoutBtn" class="ghost-btn">خروج</button>
      </div>
    </header>

    <div class="container">
      <section id="stats" class="stats">
        <div class="stat-card">
          <span class="stat-num" id="statJournal">—</span>
          <span class="stat-label">تدوينات</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statStreak">—</span>
          <span class="stat-label">أيام متتالية</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statMood">—</span>
          <span class="stat-label">المزاج الغالب</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statGoals">—</span>
          <span class="stat-label">أهداف</span>
        </div>
      </section>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="journal">📝 يوميات</button>
        <button class="tab" data-tab="goals">🎯 أهداف</button>
      </nav>

      <!-- ========== يوميات ========== -->
      <section class="tab-panel" data-panel="journal">
        <div class="panel analyze-panel">
          <div class="panel-head">
            <h2>تحليل أيامك</h2>
            <div class="analyze-controls">
              <select id="days" class="select">
                <option value="7">آخر ٧ أيام</option>
                <option value="14">آخر ١٤ يوم</option>
                <option value="30">آخر شهر</option>
              </select>
              <button id="analyzeBtn" class="primary-btn">حلّلي</button>
            </div>
          </div>
          <div id="analysis" class="analysis-result hidden"></div>
        </div>
        <h2 class="section-title">يومياتك</h2>
        <div id="entries" class="entries">
          <p class="muted center">بحمّل اليوميات...</p>
        </div>
      </section>

      <!-- ========== أهداف ========== -->
      <section class="tab-panel hidden" data-panel="goals">
        <div class="panel">
          <div class="panel-head"><h2>أضف هدف</h2></div>
          <form id="goalForm" class="goal-form">
            <input id="goalTitle" class="select gf" placeholder="اسم الهدف (مثلاً: أوصل ٥٠٠ ألف)" required />
            <input id="goalTarget" class="select gf" type="number" placeholder="الرقم المستهدف" />
            <input id="goalUnit" class="select gf" placeholder="الوحدة (جنيه)" />
            <button type="submit" class="primary-btn">إضافة</button>
          </form>
          <p class="muted" style="margin-top: 10px">
            أو قول للبوت بصوتك: «عايز أوصل ٥٠٠ ألف، عملت منهم ١٠ آلاف» — وكل ما تحقّق
            تقدّم قوله «النهاردة عملت ٥ آلاف» وهيزوّدهم لوحده.
          </p>
        </div>
        <div id="goals" class="goals-grid"></div>
      </section>
    </div>

    <div id="confirmOverlay" class="modal-overlay hidden">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-icon">🗑️</div>
        <h3 class="modal-title">متأكد إنك عايز تمسحها؟</h3>
        <p class="modal-text">مش هتقدر ترجّعها بعد كده.</p>
        <div class="modal-actions">
          <button id="confirmCancel" class="ghost-btn">إلغاء</button>
          <button id="confirmOk" class="danger-btn">امسح</button>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
