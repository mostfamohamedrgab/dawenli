<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوّنلي — تسجيل الدخول</title>
    <link rel="icon" href="/assets/logo/dawwenli-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <img class="auth-logo" src="/assets/logo/dawwenli-logo.svg" alt="دوّنلي" />
      <p class="auth-sub">دفترك الشخصي — سجّل دخولك تشوف حياتك مرتّبة</p>

      <div class="auth-tabs">
        <button id="tabCode" class="auth-tab active" type="button">دخول بكود 🔑</button>
        <button id="tabPassword" class="auth-tab" type="button">كلمة سر</button>
      </div>

      <form id="loginForm" class="auth-form" autocomplete="off">
        <div id="codeField">
          <label for="code">الكود من البوت</label>
          <input
            type="text"
            id="code"
            name="code"
            class="field"
            inputmode="numeric"
            placeholder="ابعت ‎/code للبوت على تيليجرام"
          />
        </div>
        <div id="passwordField" hidden>
          <label for="password">كلمة السر</label>
          <input type="password" id="password" name="password" class="field" placeholder="••••••••" />
        </div>
        <label class="remember">
          <input type="checkbox" id="remember" checked />
          <span>فكّرني (سيبني داخل ٣٠ يوم)</span>
        </label>
        <button type="submit" id="submitBtn" class="btn">دخول</button>
        <p id="error" class="auth-error" hidden></p>
      </form>

      <footer class="auth-foot">دوّنلي — احكيلي يومك وأنا أرتّبه ✎</footer>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
