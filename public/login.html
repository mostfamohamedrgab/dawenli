<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوّنلي — تسجيل الدخول</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <div class="brand">
        <div class="brand-mark"><img src="/assets/logo/dawwenli-mark.svg" alt="دوّنلي" /></div>
        <h1>دوّنلي</h1>
      </div>
      <p class="auth-sub">يومياتك في مكان واحد — سجّل دخولك للوحة التحكم</p>

      <div class="auth-tabs">
        <button id="tabCode" class="auth-tab active" type="button">دخول بكود 🔑</button>
        <button id="tabPassword" class="auth-tab" type="button">كلمة سر</button>
      </div>

      <form id="loginForm" class="auth-form" autocomplete="off">
        <div id="codeField">
          <label for="code">الكود من البوت</label>
          <div class="field">
            <input
              type="text"
              id="code"
              name="code"
              inputmode="numeric"
              placeholder="ابعت ‎/code للبوت على تليجرام"
            />
          </div>
        </div>
        <div id="passwordField" hidden>
          <label for="password">كلمة السر</label>
          <div class="field">
            <input type="password" id="password" name="password" placeholder="••••••••" />
          </div>
        </div>
        <label class="remember">
          <input type="checkbox" id="remember" checked />
          <span>فكّرني (سيبني داخل ٣٠ يوم)</span>
        </label>
        <button type="submit" id="submitBtn">دخول</button>
        <p id="error" class="auth-error" hidden></p>
      </form>

      <footer class="auth-foot">دوّنلي — رفيق التدوين الذكي</footer>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
