<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوّنلي — تسجيل الدخول</title>
    <link rel="icon" href="/assets/logo/dawwenli-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <img class="auth-logo" src="/assets/logo/dawwenli-logo.svg" alt="دوّنلي" />
      <p class="auth-sub">دفترك الشخصي — سجّل دخولك تشوف حياتك مرتّبة</p>

      <div class="auth-tabs">
        <button id="tabEmail" class="auth-tab active" type="button">📧 إيميل</button>
        <button id="tabCode" class="auth-tab" type="button">🔑 كود البوت</button>
      </div>

      <form id="loginForm" class="auth-form" autocomplete="off">
        <div id="emailFields">
          <div id="nameField" hidden>
            <label for="name">اسمك</label>
            <input type="text" id="name" class="field" placeholder="اسمك إيه؟" style="margin-bottom:14px" />
          </div>
          <label for="email">الإيميل</label>
          <input type="email" id="email" class="field" placeholder="you@example.com" style="margin-bottom:14px" />
          <label for="emailPassword">كلمة السر</label>
          <input type="password" id="emailPassword" class="field" placeholder="••••••••" />
          <p style="margin:12px 0 0;font-size:var(--text-sm);color:var(--ink-muted)">
            <a href="#" id="modeToggle" style="color:var(--brand-deep);font-weight:700">مفيش حساب؟ اعمل واحد جديد</a>
          </p>
        </div>
        <div id="codeField" hidden>
          <label for="code">الكود من البوت</label>
          <input
            type="text"
            id="code"
            name="code"
            class="field"
            inputmode="numeric"
            placeholder="ابعت ‎/code للبوت على تيليجرام"
          />
        </div>
        <label class="remember">
          <input type="checkbox" id="remember" checked />
          <span>فكّرني (سيبني داخل ٣٠ يوم)</span>
        </label>
        <button type="submit" id="submitBtn" class="btn">دخول</button>
        <p id="error" class="auth-error" hidden></p>
      </form>

      <footer class="auth-foot">
        دوّنلي — احكيلي يومك وأنا أرتّبه ✎
        <br />
        <a href="/admin/login" style="color:var(--ink-faint);font-size:var(--text-xs)">دخول الأدمن ↗</a>
      </footer>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
