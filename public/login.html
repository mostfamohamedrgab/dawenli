<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>دوّنلي — تسجيل الدخول</title>
    <link rel="icon" href="/assets/logo/dawwenli-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <img class="auth-logo" src="/assets/logo/dawwenli-logo.svg" alt="دوّنلي" />
      <p class="auth-sub" id="authSub">أهلاً بيك تاني — سجّل دخولك تكمّل دفترك</p>

      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">دخول</button>
        <button id="tabSignup" class="auth-tab" type="button">حساب جديد</button>
      </div>

      <form id="loginForm" class="auth-form" autocomplete="off">
        <div id="nameField" class="auth-collapse">
          <label for="name">اسمك</label>
          <input type="text" id="name" class="field" placeholder="اسمك إيه؟" />
        </div>
        <label for="email">الإيميل</label>
        <input type="email" id="email" class="field" placeholder="you@example.com" style="margin-bottom:14px" />
        <label for="emailPassword">كلمة السر</label>
        <div class="pw-wrap">
          <input type="password" id="emailPassword" class="field" placeholder="••••••••" />
          <button type="button" id="togglePw" class="pw-toggle" aria-label="إظهار كلمة السر" aria-pressed="false">👁️</button>
        </div>
        <label class="remember">
          <input type="checkbox" id="remember" checked />
          <span>فكّرني (سيبني داخل ٣٠ يوم)</span>
        </label>
        <button type="submit" id="submitBtn" class="btn">دخول</button>
        <p id="error" class="auth-error" hidden></p>
      </form>

      <footer class="auth-foot">
        دوّنلي — احكِ لي يومك وأنا أرتّبه ✎
        <br />
        <a href="/admin/login" style="color:var(--ink-faint);font-size:var(--text-xs)">دخول الأدمن ↗</a>
      </footer>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
