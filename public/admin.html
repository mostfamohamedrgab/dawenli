<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دوّنلي — لوحة الأدمن</title>
    <link rel="icon" href="/assets/logo/dawwenli-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .admin-wrap { max-width: 1140px; margin: 0 auto; padding: clamp(18px, 4vw, 40px); }
      .admin-top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 14px; flex-wrap: wrap; margin-bottom: 26px;
      }
      .admin-top .a-title { display: flex; align-items: center; gap: 12px; }
      .admin-top .a-title img { height: 36px; }
      .admin-top h1 { font: var(--type-h2); font-size: clamp(22px, 3vw, 30px); }
      .users-table { width: 100%; border-collapse: collapse; }
      .users-table th, .users-table td {
        text-align: start; padding: 12px 14px; border-bottom: 1px solid var(--hairline);
        font-size: var(--text-sm); white-space: nowrap;
      }
      .users-table th { font: var(--type-label); color: var(--ink-muted); }
      .users-table tbody tr { cursor: pointer; transition: background var(--dur-fast); }
      .users-table tbody tr:hover { background: var(--brand-wash); }
      .users-table .u-name { font-weight: 700; color: var(--ink); }
      .table-scroll { overflow-x: auto; }
      .pill-tg { color: var(--goals-deep); background: var(--goals-wash); border-radius: var(--radius-pill); padding: 2px 9px; font-size: var(--text-xs); font-weight: 700; }
      .pill-no { color: var(--ink-faint); font-size: var(--text-xs); }
      .drawer-overlay {
        position: fixed; inset: 0; background: rgba(52,48,42,.4);
        display: none; align-items: stretch; justify-content: flex-start; z-index: 80;
      }
      .drawer-overlay.show { display: flex; }
      .drawer {
        width: min(520px, 92vw); background: var(--paper); height: 100%;
        overflow-y: auto; padding: 26px; box-shadow: var(--shadow-lg);
        border-inline-end: 1px solid var(--hairline);
      }
    </style>
  </head>
  <body>
    <div class="admin-wrap">
      <div class="admin-top">
        <div class="a-title">
          <img src="/assets/logo/dawwenli-logo.svg" alt="دوّنلي" />
          <h1>🛡️ لوحة الأدمن</h1>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="muted" id="adminName" style="font-size:var(--text-sm)"></span>
          <button class="btn ghost sm" id="refreshBtn">↻ تحديث</button>
          <button class="btn secondary sm" id="logoutBtn">خروج</button>
        </div>
      </div>

      <div class="stat-grid" id="statCards" style="margin-bottom:28px"></div>

      <!-- ===== تحديثات التطبيق (من الجيت) ===== -->
      <div class="card" style="margin-bottom:24px">
        <div class="card-head">
          <h3>⬆️ تحديثات التطبيق</h3>
          <span id="verStatus" style="font-size:var(--text-sm)"></span>
        </div>
        <div id="verCurrent" class="muted" style="font-size:var(--text-sm);line-height:1.9"></div>
        <div id="verChangelog" style="margin-top:12px"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
          <button class="btn secondary sm" id="verCheckBtn">🔄 اتشيّك على التحديثات</button>
          <button class="btn sm" id="verUpdateBtn" style="display:none">⬇️ اسحب التحديث</button>
        </div>
        <p id="verResult" style="font-size:var(--text-sm);margin:12px 0 0;line-height:1.9"></p>
      </div>

      <!-- ===== مزود الذكاء (OpenAI / Gemini / Grok / مخصص) ===== -->
      <div class="card" style="margin-bottom:24px">
        <div class="card-head">
          <h3>🧠 مزود الذكاء</h3>
          <span id="aiStatus" style="font-size:var(--text-sm)"></span>
        </div>
        <form id="aiForm" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:var(--text-sm)">
            المزود
            <select id="aiProvider" class="field" style="min-width:180px">
              <option value="openai">OpenAI</option>
              <option value="gemini">Google Gemini</option>
              <option value="xai">xAI (Grok)</option>
              <option value="custom">مخصص (متوافق OpenAI)</option>
            </select>
          </label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:var(--text-sm);flex:1;min-width:220px">
            مفتاح الـ API <span class="muted" id="aiKeyHint" style="font-size:var(--text-xs)"></span>
            <input id="aiKey" class="field" type="password" autocomplete="off" placeholder="حط المفتاح هنا" />
          </label>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:var(--text-sm)">
            الموديل
            <input id="aiModel" class="field" style="min-width:170px" placeholder="gpt-4o" />
          </label>
          <label id="aiBaseUrlWrap" style="display:none;flex-direction:column;gap:4px;font-size:var(--text-sm);flex:1;min-width:240px">
            Base URL (للمخصص)
            <input id="aiBaseUrl" class="field" placeholder="https://api.example.com/v1" />
          </label>
          <label id="aiVoiceWrap" style="display:none;flex-direction:column;gap:4px;font-size:var(--text-sm);flex:1;min-width:220px">
            مفتاح OpenAI للصوت (اختياري) <span class="muted" style="font-size:var(--text-xs)">التفريغ والنطق بيشتغلوا على OpenAI</span>
            <input id="aiVoiceKey" class="field" type="password" autocomplete="off" placeholder="sk-... (سيبه فاضي لو مش عايز صوت)" />
          </label>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn secondary sm" id="aiTestBtn">🧪 اختبار الاتصال</button>
            <button type="submit" class="btn sm">💾 حفظ</button>
          </div>
        </form>
        <p id="aiResult" style="font-size:var(--text-sm);margin:12px 0 0;line-height:1.8"></p>
      </div>

      <div class="card" style="margin-bottom:24px">
        <div class="card-head">
          <h3>🤖 استهلاك الـAI (تفصيلي)</h3>
          <span class="muted" id="usageTotals" style="font-size:var(--text-sm)"></span>
        </div>
        <div class="table-scroll">
          <table class="users-table">
            <thead>
              <tr>
                <th>العملية</th><th>الموديل</th><th>نداءات</th>
                <th>توكن إدخال</th><th>توكن إخراج</th><th>دقايق صوت</th><th>التكلفة</th>
              </tr>
            </thead>
            <tbody id="usageBody"></tbody>
          </table>
        </div>
        <p class="muted" id="usageNote" style="font-size:var(--text-xs);margin-top:14px;line-height:1.8"></p>
      </div>

      <div class="card" style="margin-bottom:24px">
        <div class="card-head"><h3>👥 المستخدمين</h3><span class="muted" id="usersCount" style="font-size:var(--text-sm)"></span></div>
        <form id="newUserForm" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px">
          <input id="nuName" class="field" placeholder="الاسم (اختياري)" style="width:150px" />
          <input id="nuEmail" type="email" class="field" placeholder="الإيميل" style="width:210px" required />
          <input id="nuPass" class="field" placeholder="كلمة السر (٦ حروف+)" style="width:160px" required />
          <button type="submit" class="btn sm">＋ أضف حساب</button>
          <span id="nuResult" style="font-size:var(--text-sm)"></span>
        </form>
        <div class="table-scroll">
          <table class="users-table">
            <thead>
              <tr>
                <th>المستخدم</th><th>إشعارات</th><th>آخر ظهور</th>
                <th>يوميات</th><th>فلوس</th><th>صحة</th><th>مهام</th><th>محادثات</th><th>تكلفة AI</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- درج تفاصيل المستخدم -->
    <div class="drawer-overlay" id="drawerOverlay">
      <div class="drawer" id="drawer"></div>
    </div>

    <script src="/admin.js"></script>
  </body>
</html>
